
<style>
*{box-sizing:border-box}.terminal{background:#111a15;color:#b7edc1;font-family:monospace;padding:18px;border-radius:12px;min-height:270px}.top{display:flex;justify-content:space-between;color:#8ca898;font-size:11px;border-bottom:1px solid #405a49;padding-bottom:12px}.panel{text-align:center;padding:15px 4px}.horse{font-size:48px;position:relative;display:inline-block;transform:scaleX(-1)}.track{position:relative;overflow:hidden;border-bottom:2px dashed #658e73;height:85px;display:flex;align-items:center;justify-content:center}.running .horse{animation:ride .5s infinite alternate ease-in-out}.running.track{animation:road .5s infinite linear}@keyframes ride{from{transform:translateY(2px) rotate(-4deg) scaleX(-1)}to{transform:translateY(-8px) rotate(4deg) scaleX(-1)}}@keyframes road{to{border-bottom-color:#a6d8b1}}.stats{display:flex;justify-content:space-between;text-align:left;padding:14px 4px;gap:10px}.stats small{display:block;color:#9bb3a3;font-size:10px;margin-bottom:7px}.number{font-size:23px;font-weight:bold}.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}button{font-family:inherit;background:#234731;color:#d5f5de;border:1px solid #6a9678;padding:10px 15px;border-radius:5px;cursor:pointer}button:hover{background:#365c42}h2{font-size:19px;margin:8px 0 12px}p{font-size:12px;color:#a9c5b1}.foot{font-size:10px;text-align:center;color:#849e8b;margin-top:13px}
</style>
<div class="terminal"><div class="top"><span>● ● ● &nbsp; taxi_meter</span><span id="state">START</span></div><div id="screen"></div><div class="foot">SIMULATION · BASE 4,000 KRW · +200 KRW / 2 SEC</div></div>
<script>
let timer=null,start=0,elapsed=0,fare=4000,mode="START";
const screen=document.getElementById("screen");
function state(s){mode=s;document.getElementById("state").textContent=s}
function home(){clearInterval(timer);state("START");screen.innerHTML='<div class="panel"><h2>TERMINAL TAXI</h2><div class="horse">🐎</div><p>Ready for a ride?</p><div class="controls"><button id="go">[1] START</button><button id="exit">[2] EXIT</button></div></div>';document.getElementById("go").onclick=run;document.getElementById("exit").onclick=()=>{state("EXIT");screen.innerHTML='<div class="panel"><h2>Goodbye!</h2><p>Terminal restored.</p><button id="again">RESTART</button></div>';document.getElementById("again").onclick=home}}
function update(){elapsed=Math.floor((Date.now()-start)/1000);fare=4000+Math.floor(elapsed/2)*200;document.getElementById("elapsed").textContent=[Math.floor(elapsed/3600),Math.floor(elapsed/60)%60,elapsed%60].map(n=>String(n).padStart(2,"0")).join(":");document.getElementById("fare").textContent=fare.toLocaleString()+"원"}
function run(){state("RUNNING");start=Date.now();screen.innerHTML='<div class="track running"><div class="horse">🐎</div></div><div class="stats"><div><small>ELAPSED TIME</small><div class="number" id="elapsed"></div></div><div><small>CURRENT FARE</small><div class="number" id="fare"></div></div></div><div class="controls"><button id="stop">[Q] STOP</button></div>';update();timer=setInterval(update,100);document.getElementById("stop").onclick=()=>{update();clearInterval(timer);pay()}}
function pay(){state("PAY");screen.innerHTML='<div class="panel"><h2>PAYMENT</h2><p>TOTAL FARE</p><div class="number">'+fare.toLocaleString()+'원</div><p>Select payment method</p><div class="controls"><button id="card">[1] CARD</button><button id="cash">[2] CASH</button></div></div>';document.getElementById("card").onclick=()=>done("CARD");document.getElementById("cash").onclick=()=>done("CASH")}
function done(method){state("PAID");screen.innerHTML='<div class="panel"><h2>✓ PAYMENT COMPLETE</h2><p>'+method+' · '+fare.toLocaleString()+'원</p><h2>Thank you!</h2><div class="controls"><button id="newride">[R] NEW RIDE</button></div></div>';document.getElementById("newride").onclick=home}
home();
</script>
